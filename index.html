<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Caryll's Growth Portfolio</title>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"/>
  
  <style>
    /* FORCE ENTIRE PAGE TO CENTER AND REMOVE GAPS */
    html, body { 
      margin: 0 !important; 
      padding: 0 !important; 
      width: 100% !important;
      height: 100% !important;
      min-height: 100vh !important;
      background-color: #ffffff !important; 
      font-family: 'Quicksand', sans-serif !important; 
      color: #1a1a1a !important; 
      display: flex !important;
      flex-direction: column !important;
      justify-content: space-between !important;
      align-items: center !important;
      box-sizing: border-box !important;
    }

    /* MAIN CONTAINER */
    .cover-wrapper {
      width: 100% !important; 
      max-width: 600px !important;
      margin: auto !important;
      display: flex !important; 
      flex-direction: column !important;
      justify-content: center !important; 
      align-items: center !important; 
      text-align: center !important; 
      padding: 30px !important;
      box-sizing: border-box !important;
    }
    
    /* VIBRANT LEAF ICON */
    .hero-icon {
      font-size: 65px !important; 
      color: #27ae60 !important; 
      margin-bottom: 25px !important;
      display: block !important;
    }

    h1 { 
      font-family: 'Montserrat', sans-serif !important; 
      font-size: 36px !important; 
      font-weight: 800 !important; 
      color: #2d3436 !important; 
      text-transform: uppercase !important; 
      letter-spacing: 8px !important; 
      margin: 0 !important; 
      line-height: 1.2 !important;
    }
    
    .subtitle { 
      font-size: 13px !important; 
      font-weight: 700 !important; 
      color: #e67e22 !important; 
      text-transform: uppercase !important; 
      letter-spacing: 5px !important; 
      margin: 15px 0 60px !important; 
    }
    
    /* QUOTE CONTAINER */
    .quote-container {
      width: 100% !important;
      max-width: 450px !important;
      margin-bottom: 50px !important;
    }

    .quote-text {
      font-size: 18px !important; 
      color: #2d3436 !important; 
      text-transform: uppercase !important; 
      letter-spacing: 2px !important; 
      line-height: 1.6 !important; 
      font-weight: 700 !important;
    }
    
    .quote-author { 
      display: block !important; 
      font-size: 14px !important; 
      font-style: italic !important; 
      margin-top: 12px !important; 
      color: #d35400 !important; 
      font-weight: 700 !important; 
      text-transform: none !important;
    }

    /* THE SWEET RED APPLE */
    .fruit-link { 
      display: flex !important; 
      flex-direction: column !important; 
      align-items: center !important; 
      text-decoration: none !important; 
    }
    
    .fruit-icon {
      color: #c0392b !important; 
      font-size: 55px !important; 
      margin-bottom: 15px !important;
      display: block !important;
    }
    
    .enter-text { 
      font-family: 'Montserrat', sans-serif !important; 
      font-size: 11px !important; 
      color: #27ae60 !important; 
      text-transform: uppercase !important; 
      letter-spacing: 3px !important; 
      font-weight: 800 !important;
    }

    /* BOTTOM FOOTER */
    footer { 
      width: 100% !important;
      padding: 30px 0 !important; 
      text-align: center !important; 
      font-size: 10px !important; 
      color: #95a5a6 !important; 
      letter-spacing: 3px !important; 
      font-weight: 700 !important; 
    }
  </style>
</head>
<body>

  <div class="cover-wrapper">
    <div class="hero-icon">
      <i class="fa-solid fa-seedling"></i>
    </div>

    <h1>CARYLL'S</h1>
    <p class="subtitle">GROWTH PORTFOLIO</p>
    
    <div class="quote-container">
      <div class="quote-text">"The roots of education are bitter, but the fruit is sweet."</div>
      <span class="quote-author">— Aristotle</span>
    </div>
    
    <a class="fruit-link" href="dashboard.html">
      <i class="fa-solid fa-apple-whole fruit-icon"></i>
      <span class="enter-text">Click fruit to continue</span>
    </a>
  </div>

  <footer>© 2026 CARYLL'S GROWTH PORTFOLIO</footer>

</body>
</html>

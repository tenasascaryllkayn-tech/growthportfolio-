<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Caryll's Growth Portfolio</title>
  <meta content='width=device-width, initial-scale=1' name='viewport'/>
  <link href='https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&amp;family=Quicksand:wght@500;700&amp;display=swap' rel='stylesheet'/>
  <link href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css' rel='stylesheet'/>  
  <style>
    /* LIVELY & HIGH-CONTRAST PORTFOLIO THEME */
    body { 
      font-family: 'Quicksand', sans-serif; 
      background-color: #ffffff; 
      color: #1a1a1a; 
      margin: 0; padding: 0; 
    }

    /* HERO WRAPPER */
    .cover-wrapper {
      width: 100%; min-height: 100vh; display: flex; flex-direction: column;
      justify-content: center; align-items: center; text-align: center; padding: 20px;
      box-sizing: border-box;
    }
    
    /* VIBRANT LEAF ICON */
    .hero-icon {
      font-size: 60px; color: #27ae60; 
      margin-bottom: 20px;
      filter: drop-shadow(0 4px 8px rgba(39, 174, 96, 0.2));
    }

    h1 { 
      font-family: 'Montserrat', sans-serif; font-size: 38px; font-weight: 800; 
      color: #2d3436; text-transform: uppercase; letter-spacing: 10px; margin: 0; 
      line-height: 1.2;
    }
    
    .subtitle { 
      font-size: 12px; font-weight: 700; color: #e67e22; 
      text-transform: uppercase; letter-spacing: 6px; margin: 15px 0 80px; 
    }
    
    /* QUOTE SECTION */
    .quote-container {
      max-width: 500px;
      margin-bottom: 60px;
    }

    .quote-text {
      font-size: 19px; color: #2d3436; text-transform: uppercase; 
      letter-spacing: 2px; line-height: 1.6; font-weight: 700;
    }
    
    .quote-author { 
      display: block; font-size: 14px; font-style: italic; 
      margin-top: 15px; color: #d35400; font-weight: 700; text-transform: none;
    }

    /* THE SWEET APPLE */
    .fruit-link { display: flex; flex-direction: column; align-items: center; text-decoration: none; }
    .fruit-icon {
      color: #c0392b; /* Bold, Sweet Apple Red */
      font-size: 50px; margin-bottom: 15px;
      filter: drop-shadow(0 8px 15px rgba(192, 57, 43, 0.3));
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .fruit-link:hover .fruit-icon { transform: scale(1.15); }
    
    .enter-text { 
      font-family: 'Montserrat', sans-serif; font-size: 10px; color: #27ae60; 
      text-transform: uppercase; letter-spacing: 3px; font-weight: 800;
    }

    footer { padding: 40px 0; text-align: center; font-size: 10px; color: #95a5a6; letter-spacing: 4px; font-weight: 700; }
  </style>
</head>
<body>

  <div class='cover-wrapper'>
    <div class='hero-icon'>
      <i class='fa-solid fa-seedling'></i>
    </div>

    <h1>CARYLL'S</h1>
    <p class='subtitle'>GROWTH PORTFOLIO</p>
    
    <div class='quote-container'>
      <div class='quote-text'>"The roots of education are bitter, but the fruit is sweet."</div>
      <span class='quote-author'>— Aristotle</span>
    </div>
    
    <!-- This links to your dashboard.html file on GitHub -->
    <a class='fruit-link' href='dashboard.html'>
      <i class='fa-solid fa-apple-whole fruit-icon'></i>
      <span class='enter-text'>Click fruit to continue</span>
    </a>
  </div>

  <footer>© 2026 CARYLL'S GROWTH PORTFOLIO</footer>

</body>
</html>

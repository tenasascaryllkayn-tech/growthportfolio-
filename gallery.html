<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gallery | Caryll's Growth Portfolio</title>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"/>
  
  <style>
    body { margin: 0; background-color: #ffffff; font-family: 'Quicksand', sans-serif; color: #2d3436; display: flex; flex-direction: column; align-items: center; padding-top: 60px; padding-bottom: 60px; }
    
    .gallery-container { width: 100%; max-width: 900px; padding: 0 20px; box-sizing: border-box; text-align: center; }
    
    /* Seedling icon style as per visual guides */
    .hero-seedling { font-size: 32px; color: #4a6741; margin-bottom: 10px; }
    
    h1 { font-family: 'Montserrat', sans-serif; font-size: 32px; color: #2d3436; text-transform: uppercase; letter-spacing: 4px; margin-bottom: 40px; }
    
    .gallery-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; margin-bottom: 50px; }
    .gallery-item { width: 100%; background: #ffffff; border: 1px solid #e6e4e0; border-radius: 20px; padding: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); overflow: hidden; }
    iframe { width: 100%; height: 500px; border: none; border-radius: 12px; }

    /* Dashboard Button Style matching 2643.jpg and 2644.jpg */
    .return-btn {
      display: inline-block;
      padding: 12px 30px;
      border: 2px solid #d37327;
      color: #d37327;
      text-decoration: none;
      font-weight: 700;
      border-radius: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.3s;
    }
    .return-btn:hover { background: #d37327; color: #ffffff; }
  </style>
</head>
<body>

  <div class="gallery-container">
    <div class="hero-seedling"><i class="fa-solid fa-seedling"></i></div>
    <h1>Gallery</h1>
    
    <div class="gallery-grid">
      <div class="gallery-item"><iframe src="https://new.express.adobe.com/webpage/5kfF3saYKHRgN"></iframe></div>
      <div class="gallery-item"><iframe src="https://new.express.adobe.com/webpage/oSj91UiKFZgJ3"></iframe></div>
      <div class="gallery-item"><iframe src="https://new.express.adobe.com/webpage/UwKBgvsWeC68N"></iframe></div>
      <div class="gallery-item"><iframe src="https://new.express.adobe.com/webpage/nkvcGAoPUSe5j"></iframe></div>
    </div>

    <a href="dashboard.html" class="return-btn">← Return to Dashboard</a>
  </div>

</body>
</html>

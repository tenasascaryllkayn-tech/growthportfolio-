<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gallery | Caryll's Growth Portfolio</title>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"/>
  
  <style>
    body { margin: 0; background-color: #ffffff; font-family: 'Quicksand', sans-serif; color: #2d3436; display: block; padding-top: 60px; }
    .top-progress-container { position: fixed; top: 0; left: 0; width: 100%; height: 12px; background-color: #f2f4f4; z-index: 2000; }
    .top-progress-bar { width: 0%; height: 100%; background: linear-gradient(to right, #27ae60, #a3e4d7, #f5b041, #c0392b); }
    
    .gallery-container { width: 100%; max-width: 1000px; margin: 0 auto; padding: 40px 20px; box-sizing: border-box; }
    h1 { font-family: 'Montserrat', sans-serif; font-size: 32px; color: #4a6741; text-transform: uppercase; letter-spacing: 4px; text-align: center; margin-bottom: 40px; }
    
    .gallery-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; }
    .gallery-item { width: 100%; background: #ffffff; border: 1px solid #e6e4e0; border-radius: 20px; padding: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); overflow: hidden; }
    iframe { width: 100%; height: 500px; border: none; border-radius: 12px; }

    .lower-control-panel { position: fixed; right: 25px; bottom: 25px; z-index: 1100; }
    .control-btn { width: 48px; height: 48px; background-color: #2d3436; color: #ffffff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; text-decoration: none; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
  </style>
</head>
<body>

  <div class="top-progress-container"><div id="scrollProgressBar" class="top-progress-bar"></div></div>

  <div class="lower-control-panel">
    <a href="index.html" class="control-btn" aria-label="Return to Dashboard"><i class="fa-solid fa-house"></i></a>
  </div>

  <div class="gallery-container">
    <h1>Gallery</h1>
    <div class="gallery-grid">
      <div class="gallery-item"><iframe src="https://new.express.adobe.com/webpage/5kfF3saYKHRgN"></iframe></div>
      <div class="gallery-item"><iframe src="https://new.express.adobe.com/webpage/oSj91UiKFZgJ3"></iframe></div>
      <div class="gallery-item"><iframe src="https://new.express.adobe.com/webpage/UwKBgvsWeC68N"></iframe></div>
      <div class="gallery-item"><iframe src="https://new.express.adobe.com/webpage/nkvcGAoPUSe5j"></iframe></div>
    </div>
  </div>

  <script>
    window.onscroll = function() {
      var winScroll = window.pageYOffset || document.documentElement.scrollTop;
      var totalHeight = document.documentElement.scrollHeight - window.innerHeight;
      var scrolled = (winScroll / totalHeight) * 100;
      document.getElementById("scrollProgressBar").style.width = scrolled + "%";
    }
  </script>
</body>
</html>

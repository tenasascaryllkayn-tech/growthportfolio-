<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Reflection | Caryll's Growth Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet"/>
  <style>
    body { 
      font-family: 'Quicksand', sans-serif; 
      background-color: #ffffff; 
      color: #2d3436; 
      margin: 0; 
      padding: 40px 20px; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
    }

    .nav-container { 
      width: 100%; 
      max-width: 950px; 
      margin-bottom: 30px; 
      text-align: center;
    }

    /* Matching the button aesthetic from your dashboard */
    .back-btn { 
      font-family: 'Montserrat', sans-serif; 
      font-size: 12px; 
      font-weight: 700; 
      text-transform: uppercase; 
      color: #e67e22; 
      text-decoration: none; 
      border: 2px solid #e67e22; 
      padding: 10px 25px; 
      border-radius: 25px; 
      transition: 0.3s; 
    }
    .back-btn:hover { background: #e67e22; color: #ffffff; }

    .reflection-wrapper { 
      width: 100%; 
      max-width: 950px; 
      background: #fafbfc; 
      border: 1px solid #f0f3f4; 
      border-radius: 20px; 
      padding: 20px;
    }
  </style>
</head>
<body>

  <div class="nav-container">
    <a href="dashboard.html" class="back-btn">← Back to Dashboard</a>
  </div>

  <div class="reflection-wrapper">
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Course Reflection | Growth Portfolio</title>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
  
  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"/>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: #ffffff;
      color: #2d3436;
      font-family: 'Quicksand', sans-serif;
      padding: 40px 20px 80px 20px; 
      max-width: 600px; 
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .brand-icon { 
      color: #2ecc71; 
      font-size: 32px; 
      margin-bottom: 10px; 
      animation: gentle-bounce 2s infinite ease-in-out; 
    }

    .page-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 24px;
      font-weight: 800;
      color: #2d3436;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 30px;
      text-align: center;
    }

    .page-title::after {
      content: '';
      display: block;
      width: 40px;
      height: 3px;
      background-color: #e67e22;
      margin: 15px auto 30px auto;
      border-radius: 2px;
    }

    .embed-container {
      width: 100%; 
      height: 600px;
      background: #fafafa;
      border: 1px solid rgba(0, 0, 0, 0.06);
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      margin-bottom: 30px;
      overflow: hidden;
    }

    iframe { width: 100%; height: 100%; border: 0; }

    .nav-btn {
      display: block;
      padding: 12px 24px;
      border: 2px solid #e67e22;
      color: #e67e22;
      text-decoration: none;
      border-radius: 8px;
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 1px;
      text-align: center;
      transition: all 0.3s ease;
      width: 100%;
      max-width: 300px;
    }

    .nav-btn:hover { background-color: #e67e22; color: #ffffff; }

    .footer-text { 
      font-family: 'Montserrat', sans-serif; 
      font-size: 10px; 
      color: #b2bec3; 
      margin-top: 40px; 
      text-transform: uppercase; 
    }

    @keyframes gentle-bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
  </style>
</head>
<body>

  <div class="brand-icon"><i class="fa-solid fa-seedling"></i></div>
  <h1 class="page-title">Course Reflection</h1>

  <div class="embed-container">
    <iframe src="https://sassy-flier-535.notion.site/ebd//1c355077bf114a6e9b14531ba144a65e" allowfullscreen></iframe>
  </div>

  <a href="dashboard.html" class="nav-btn">Return to Dashboard</a>

  <div class="footer-text">© 2026 Caryll's Growth Portfolio</div>

</body>
</html>

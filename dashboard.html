<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard | Caryll's Growth Portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"/>
  
  <style>
    /* Reset & Base */
    html { margin: 0; padding: 0; width: 100%; scroll-behavior: smooth; }
    body { margin: 0; padding: 0; width: 100%; min-height: 150vh; background-color: #ffffff; font-family: 'Quicksand', sans-serif; color: #2d3436; box-sizing: border-box; }

    /* Progress Bar */
    .top-progress-container { position: fixed; top: 0; left: 0; width: 100%; height: 12px; background-color: #f2f4f4; z-index: 2000; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .top-progress-bar { width: 0%; height: 100%; background: linear-gradient(to right, #27ae60, #a3e4d7, #f5b041, #c0392b); }

    /* Layout */
    .dashboard-container { width: 100%; max-width: 950px; margin: 0 auto; padding: 80px 20px; display: flex; flex-direction: column; align-items: center; }
    .garden-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px; width: 100%; max-width: 800px; }
    @media (max-width: 650px) { .garden-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 420px) { .garden-grid { grid-template-columns: 1fr; } }

    /* Plant Card Styling */
    .plant-card { display: flex; flex-direction: column; align-items: center; text-decoration: none; background: #fafbfc; border: 1px solid #f0f3f4; border-radius: 20px; padding: 25px 15px; transition: 0.3s; color: #2d3436; position: relative; }
    .plant-card:hover { transform: translateY(-8px); box-shadow: 0 12px 24px rgba(39, 174, 96, 0.15); }
    .plant-art-container { width: 100px; height: 110px; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; position: relative; margin-bottom: 15px; }
    .terracotta-pot { width: 54px; height: 42px; background: #e67e22; border-bottom-left-radius: 12px; border-bottom-right-radius: 12px; position: relative; }
    .terracotta-pot::before { content: ''; position: absolute; top: 0; left: -4px; width: 62px; height: 8px; background: #d35400; border-radius: 4px; }
    
    /* Plant Elements */
    .apple { position: absolute; font-size: 14px; }
    .growth-element { background: #27ae60; border-radius: 50% 50% 40% 40%; margin-bottom: -4px; }
    
    /* Navigation */
    .lower-control-panel { position: fixed; right: 25px; bottom: 25px; z-index: 1100; display: flex; flex-direction: column; gap: 10px; }
    .control-btn { width: 48px; height: 48px; background-color: #27ae60; color: #ffffff; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: none; cursor: pointer; }
    .home-btn { background-color: #2d3436; }
    .flip-up { transform: rotate(180deg); }
  </style>
</head>
<body>

  <div class="top-progress-container"><div id="scrollProgressBar" class="top-progress-bar"></div></div>

  <div class="lower-control-panel">
    <a href="https://tenasascaryllkayn-tech.github.io/growthportfolio-/index.html" class="control-btn home-btn"><i class="fa-solid fa-house"></i></a>
    <button id="adaptiveArrow" class="control-btn" onclick="toggleScroll()"><i class="fa-solid fa-chevron-down"></i></button>
  </div>

  <div class="dashboard-container">
    <h1>CARYLL'S GROWTH PORTFOLIO</h1>
    <div class="garden-grid">
      
      <!-- Stage 9: CBAR (Fruiting Tree) -->
      <a href="https://tenasascaryllkayn-tech.github.io/growthportfolio-/cbar.html" class="plant-card">
        <div class="plant-art-container">
          <span class="apple" style="top:20px; left:20px;">🍎</span>
          <span class="apple" style="top:10px; right:20px;">🍎</span>
          <div style="width:10px; height:30px; background:#734d26;"></div>
          <div class="terracotta-pot"></div>
        </div>
        <span>CBAR</span>
      </a>

      <!-- Stage 8: Gallery (Tree) -->
      <a href="https://tenasascaryllkayn-tech.github.io/growthportfolio-/gallery.html" class="plant-card">
        <div class="plant-art-container">
          <div class="growth-element" style="width:50px; height:50px;"></div>
          <div class="terracotta-pot"></div>
        </div>
        <span>Gallery</span>
      </a>

      <!-- Repeat structure for all 9 stages... -->
    </div>
  </div>

  <script>
    function updateProgress() {
      const scroll = window.scrollY;
      const height = document.documentElement.scrollHeight - window.innerHeight;
      const scrolled = height > 0 ? (scroll / height) * 100 : 0;
      document.getElementById("scrollProgressBar").style.width = scrolled + "%";
      const btn = document.getElementById("adaptiveArrow");
      if (scrolled > 20) btn.classList.add("flip-up");
      else btn.classList.remove("flip-up");
    }
    function toggleScroll() {
      const btn = document.getElementById("adaptiveArrow");
      if (btn.classList.contains("flip-up")) window.scrollTo({top: 0, behavior: 'smooth'});
      else window.scrollTo({top: document.body.scrollHeight, behavior: 'smooth'});
    }
    window.addEventListener('scroll', updateProgress);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard | Miss Caryll's Teaching Portfolio</title>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"/>
  
  <style>
    /* GLOBAL RESET & ALIGNMENT */
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      min-height: 100vh !important;
      background-color: #ffffff !important;
      font-family: 'Quicksand', sans-serif !important;
      color: #2d3436 !important;
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      box-sizing: border-box !important;
      scroll-behavior: smooth;
    }

    /* FLUSH TOP PROGRESS BAR */
    .top-progress-bar {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 12px !important;
      background: linear-gradient(to right, #27ae60, #a3e4d7, #f5b041, #c0392b) !important;
      z-index: 1000 !important;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08) !important;
    }

    .dashboard-container {
      width: 100% !important;
      max-width: 900px !important;
      padding: 60px 20px 40px !important; /* Added top padding to clear the bar */
      box-sizing: border-box !important;
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
    }

    /* TOP LOGO & HEADER */
    .hero-icon {
      font-size: 55px !important; 
      color: #27ae60 !important; 
      margin-bottom: 15px !important;
      display: block !important;
    }

    h1 { 
      font-family: 'Montserrat', sans-serif !important; 
      font-size: 38px !important; 
      font-weight: 800 !important; 
      color: #2d3436 !important; 
      text-transform: uppercase !important; 
      letter-spacing: 8px !important; 
      margin: 0 !important;
      text-align: center !important;
    }
    
    .subtitle { 
      font-size: 11px !important; 
      font-weight: 700 !important; 
      color: #e67e22 !important; 
      text-transform: uppercase !important; 
      letter-spacing: 5px !important; 
      margin: 10px 0 5px 0 !important; 
      text-align: center !important;
    }

    .welcome-text {
      font-size: 13px !important;
      font-weight: 700 !important;
      color: #2d3436 !important;
      letter-spacing: 2px !important;
      text-transform: uppercase !important;
      margin: 0 0 35px 0 !important;
      text-align: center !important;
    }

    /* ARISTOTLE QUOTE BLOCK */
    .quote-container {
      max-width: 550px !important;
      text-align: center !important;
      margin-bottom: 45px !important;
    }

    .quote-text {
      font-size: 18px !important;
      font-weight: 700 !important;
      color: #2d3436 !important;
      line-height: 1.5 !important;
    }

    .quote-author {
      display: block !important;
      font-size: 14px !important;
      color: #2d3436 !important;
      margin-top: 8px !important;
    }

    /* THE APPLE GRID */
    .apple-grid {
      display: grid !important;
      grid-template-columns: repeat(3, 1fr) !important;
      gap: 30px 20px !important;
      width: 100% !important;
      max-width: 700px !important;
      margin-bottom: 50px !important;
    }

    @media (max-width: 600px) {
      .apple-grid { grid-template-columns: repeat(2, 1fr) !important; }
    }
    @media (max-width: 400px) {
      .apple-grid { grid-template-columns: 1fr !important; }
    }

    /* CUSTOM APPLE COMPONENT */
    .apple-wrapper {
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      text-decoration: none !important;
      position: relative !important;
    }

    /* APPLE LEAF / STEM */
    .apple-stem {
      width: 16px !important;
      height: 22px !important;
      background-color: #27ae60 !important;
      border-radius: 0 100% 0 100% !important;
      margin-bottom: -4px !important;
      z-index: 2 !important;
      transform: rotate(-15deg);
    }

    /* SHAPED APPLE BODY */
    .apple-body {
      width: 140px !important;
      height: 125px !important;
      background-color: #c0392b !important; 
      border-radius: 60px 60px 60px 60px / 50px 50px 75px 75px !important;
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      justify-content: center !important;
      padding: 15px !important;
      box-sizing: border-box !important;
      box-shadow: 0 8px 20px rgba(192, 57, 43, 0.15) !important;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease !important;
    }

    .apple-body::after {
      content: '<!DOCTYPE html>

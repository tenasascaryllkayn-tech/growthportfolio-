<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard | Caryll's Growth Portfolio</title>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"/>
  
  <style>
    html { margin: 0; padding: 0; width: 100%; height: 100%; scroll-behavior: smooth; }
    body { margin: 0; padding: 0; width: 100%; min-height: 101vh; background-color: #ffffff; font-family: 'Quicksand', sans-serif; color: #2d3436; }

    .dashboard-container { width: 100%; max-width: 950px; margin: 0 auto; padding: 60px 20px; display: flex; flex-direction: column; align-items: center; }
    .garden-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px 25px; width: 100%; max-width: 800px; }
    
    .plant-card { display: flex; flex-direction: column; align-items: center; text-decoration: none; background: #fafbfc; border: 1px solid #f0f3f4; border-radius: 20px; padding: 20px 10px; transition: 0.3s; position: relative; }
    .plant-card:hover { transform: translateY(-6px); background: #ffffff; }

    .plant-art-container { width: 100px; height: 110px; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; margin-bottom: 12px; position: relative; }
    .terracotta-pot { width: 54px; height: 42px; background: #e67e22; border-bottom-left-radius: 12px; border-bottom-right-radius: 12px; position: relative; box-shadow: inset 0 -5px 0 rgba(0,0,0,0.1); }
    .terracotta-pot::before { content: ''; position: absolute; top: 0; left: -4px; width: 62px; height: 8px; background: #d35400; border-radius: 4px; }
    
    /* Plant Growth Stages - RESTORED */
    .growth-element { margin-bottom: -2px; }
    .stage-1 .growth-element { width: 16px; height: 24px; background: #2ecc71; border-radius: 0 100% 0 100%; transform: rotate(-10deg); }
    .stage-2 .growth-element { width: 20px; height: 16px; background: #2ecc71; border-radius: 0 100% 0 100%; }
    .stage-3 .growth-element { width: 5px; height: 26px; background: #27ae60; }
    .stage-4 .growth-element { width: 32px; height: 32px; background: #27ae60; border-radius: 50%; }
    .stage-5 .growth-element { width: 42px; height: 40px; background: #219653; border-radius: 50% 50% 40% 40%; }
    .stage-6 .growth-element { width: 50px; height: 48px; background: #1e824c; border-radius: 45% 45% 40% 40%; }
    .stage-7 .growth-element { width: 8px; height: 22px; background: #855e42; }
    .stage-8 .growth-element { width: 10px; height: 25px; background: #734d26; }
    .stage-9 .growth-element { width: 10px; height: 25px; background: #734d26; }
    
    .pie-pan-tin { width: 68px; height: 26px; background: linear-gradient(to bottom, #8a5a36, #5c3a21); border-bottom-left-radius: 16px; border-bottom-right-radius: 16px; display: flex; align-items: center; justify-content: center; margin-bottom: 6px; }
    .ribbon { position: absolute; top: 5px; right: -25px; width: 100px; background: #e67e22; color: white; font-size: 9px; font-weight: 800; text-align: center; text-transform: uppercase; transform: rotate(45deg); padding: 3px 0; z-index: 10; }
    .topic-badge-icon { position: absolute; bottom: 12px; color: #ffffff; font-size: 13px; z-index: 5; }
    .plant-card span { font-family: 'Montserrat', sans-serif; font-size: 11px; font-weight: 700; color: #2d3436; text-transform: uppercase; margin-top: 8px; }
  </style>
</head>
<body>

  <div class="dashboard-container">
    <div class="garden-grid">
      <a href="#" class="plant-card stage-1"><div class="plant-art-container"><div class="growth-element"></div><div class="terracotta-pot"></div><i class="fa-solid fa-user-tie topic-badge-icon"></i></div><span>The Teacher</span></a>
      <a href="#" class="plant-card stage-2"><div class="plant-art-container"><div class="growth-element"></div><div class="terracotta-pot"></div><i class="fa-solid fa-school topic-badge-icon"></i></div><span>Environment</span></a>
      <a href="#" class="plant-card stage-3"><div class="plant-art-container"><div class="growth-element"></div><div class="terracotta-pot"></div><i class="fa-solid fa-lightbulb topic-badge-icon"></i></div><span>Theory</span></a>
      <a href="#" class="plant-card stage-4"><div class="plant-art-container"><div class="growth-element"></div><div class="terracotta-pot"></div><i class="fa-solid fa-heart topic-badge-icon"></i></div><span>Philosophy</span></a>
      <a href="#" class="plant-card stage-5"><div class="plant-art-container"><div class="growth-element"></div><div class="terracotta-pot"></div><i class="fa-solid fa-hand-holding-heart topic-badge-icon"></i></div><span>Management</span></a>
      <a href="#" class="plant-card stage-6"><div class="plant-art-container"><div class="growth-element"></div><div class="terracotta-pot"></div><i class="fa-solid fa-clipboard-check topic-badge-icon"></i></div><span>Assessment</span></a>
      <a href="#" class="plant-card stage-7"><div class="plant-art-container"><div class="growth-element"></div><div class="terracotta-pot"></div><i class="fa-solid fa-chalkboard-user topic-badge-icon"></i></div><span>Demo Teaching</span></a>
      <a href="#" class="plant-card stage-8"><div class="plant-art-container"><div class="growth-element"></div><div class="terracotta-pot"></div><i class="fa-solid fa-images topic-badge-icon"></i></div><span>Gallery</span></a>
      <a href="#" class="plant-card stage-9"><div class="plant-art-container"><div class="growth-element"></div><div class="terracotta-pot"></div><i class="fa-solid fa-chart-bar topic-badge-icon"></i></div><span>CBAR</span></a>
      <a href="#" class="plant-card"><div class="plant-art-container"><div class="pie-pan-tin"><i class="fa-solid fa-book-open" style="color:#fff"></i></div></div><span>Reflection</span></a>
      
      <a href="#" class="plant-card">
        <div class="plant-art-container">
          <div class="ribbon">EXTRA</div>
          <div class="pie-pan-tin"><i class="fa-solid fa-school" style="color:#fff"></i></div>
        </div>
        <span>Dream School</span>
      </a>
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Classroom Environment Assessment</title>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Quicksand:wght@400;500;700&display=swap" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"/>
  
  <style>
    :root {
        --text-color: #2c3e50;
        --accent-color: #4a6741;
        --btn-color: #d37327;
        --bg-color: #fcfbfa;
        --border-color: #e6e4e0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Quicksand', sans-serif;
      padding: 40px 20px;
      max-width: 500px;
      margin: 0 auto;
      line-height: 1.6;
    }

    h2 {
      font-family: 'Montserrat', sans-serif;
      color: var(--accent-color);
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }

    /* Document container styles */
    .doc-embed-wrapper { 
      width: 100%; 
      height: 400px; 
      border: 1px solid var(--border-color); 
      margin-bottom: 30px; 
      background: #ffffff;
    }

    /* Footer styling with left-aligned arrow */
    .footer-container { text-align: center; margin-top: 40px; }
    .dashboard-link-btn { 
      display: block;
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      color: var(--btn-color);
      text-decoration: none;
      border: 2px solid var(--btn-color);
      padding: 15px;
      border-radius: 8px;
      text-transform: uppercase;
      margin-bottom: 15px;
    }
    
    /* Left-aligned arrow matching your request */
    .left-aligned-arrow { 
      color: var(--btn-color); 
      font-size: 32px; 
      text-align: left; 
      padding-left: 10px;
      animation: bounce 2s infinite; 
    }

    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  </style>
</head>
<body>

  <h2>Classroom Environment Assessment</h2>
  
  <!-- Document Embeds -->
  <div class="doc-embed-wrapper">
    <iframe src="https://docs.google.com/document/d/1-H5LbAkzfEA9Jtmwap0_F3RibYvcoHUk/preview" width="100%" height="100%" frameborder="0"></iframe>
  </div>

  <div class="doc-embed-wrapper">
    <iframe src="https://docs.google.com/document/d/1vAr85zRzkWAu7L7xlSMdb9bgoL4blPQuB-p8p_LRmF8/preview" width="100%" height="100%" frameborder="0"></iframe>
  </div>

  <!-- Footer block -->
  <div class="footer-container">
    <a href="dashboard.html" class="dashboard-link-btn">
      <i class="fa-solid fa-arrow-left"></i> RETURN TO DASHBOARD
    </a>
    <div class="left-aligned-arrow"><i class="fa-solid fa-arrow-down"></i></div>
  </div>

</body>
</html>

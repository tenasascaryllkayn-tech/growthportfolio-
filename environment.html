<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Classroom Environment Assessment</title>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"/>
  
  <style>
    :root {
        --bg-color: #fcfbfa;
        --text-color: #2c3e50;
        --accent-color: #4a6741;
        --border-color: #e6e4e0;
        --secondary-text: #576574;
        --btn-color: #d37327;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Quicksand', sans-serif;
      padding: 40px 20px 80px 20px; 
      max-width: 500px; 
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .brand-icon { color: var(--accent-color); font-size: 32px; margin-bottom: 12px; }
    .main-page-title { font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 1.8rem; color: var(--accent-color); text-align: center; margin-bottom: 8px; }
    .subtitle { font-size: 1rem; color: var(--secondary-text); text-align: center; margin-bottom: 35px; font-style: italic; }

    .content-card { width: 100%; background: #ffffff; border: 1px solid var(--border-color); border-radius: 8px; padding: 24px; margin-bottom: 25px; }
    h3 { font-family: 'Montserrat', sans-serif; font-weight: 500; font-size: 1.1rem; color: var(--accent-color); margin-bottom: 12px; border-bottom: 1px solid var(--border-color); padding-bottom: 6px; }

    .doc-toolbar { display: flex; justify-content: flex-end; gap: 10px; background: #fdfdfd; border: 1px solid var(--border-color); border-bottom: none; padding: 8px 12px; border-top-left-radius: 6px; border-top-right-radius: 6px; }
    .toolbar-btn { background: #ffffff; border: 1px solid var(--border-color); color: var(--secondary-text); padding: 6px 12px; font-family: 'Quicksand', sans-serif; font-size: 0.8rem; font-weight: 700; border-radius: 4px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }

    .doc-embed-wrapper { position: relative; width: 100%; height: 400px; border: 1px solid var(--border-color); border-bottom-left-radius: 6px; border-bottom-right-radius: 6px; background: #fafafa; margin-bottom: 10px; }

    .footer-container { text-align: center; margin-top: 20px; padding-bottom: 40px; }
    .dashboard-link-btn { display: inline-flex; align-items: center; font-family: 'Montserrat', sans-serif; font-weight: 700; color: var(--btn-color); text-decoration: none; border: 2px solid var(--btn-color); padding: 12px 32px; border-radius: 6px; text-transform: uppercase; }

    .floating-scroll-indicator { position: fixed; bottom: 80px; right: 20px; color: var(--btn-color); font-size: 32px; animation: bounce 2s infinite; z-index: 1000; pointer-events: none; }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  </style>
</head>
<body>

  <div class="brand-icon"><i class="fa-solid fa-seedling"></i></div>
  <h1 class="main-page-title">Classroom Environment</h1>
  <p class="subtitle">Evaluating and auditing intentional learning spaces</p>

  <!-- Environmental Checklist -->
  <div class="content-card">
    <h3><i class="fa-solid fa-clipboard-check" style="margin-right: 8px;"></i> Environmental Checklist</h3>
    <div class="doc-toolbar">
      <button class="toolbar-btn"><i class="fa-solid fa-magnifying-glass-plus"></i> Zoom</button>
      <button class="toolbar-btn"><i class="fa-solid fa-arrows-up-down"></i> Scroll</button>
    </div>
    <div class="doc-embed-wrapper">
      <iframe src="https://docs.google.com/document/d/1-H5LbAkzfEA9Jtmwap0_F3RibYvcoHUk/preview" width="100%" height="100%" frameborder="0"></iframe>
    </div>
  </div>

  <!-- Reflection on Environment -->
  <div class="content-card">
    <h3><i class="fa-regular fa-comment-dots" style="margin-right: 8px;"></i> Reflection on Environment</h3>
    <div class="doc-toolbar">
      <button class="toolbar-btn"><i class="fa-solid fa-magnifying-glass-plus"></i> Zoom</button>
      <button class="toolbar-btn"><i class="fa-solid fa-arrows-up-down"></i> Scroll</button>
    </div>
    <div class="doc-embed-wrapper">
      <iframe src="https://docs.google.com/document/d/1vAr85zRzkWAu7L7xlSMdb9bgoL4blPQuB-p8p_LRmF8/preview" width="100%" height="100%" frameborder="0"></iframe>
    </div>
  </div>

  <!-- Live Reflection Journal -->
  <div class="content-card">
    <h3><i class="fa-solid fa-book-open" style="margin-right: 8px;"></i> Live Reflection Journal</h3>
    <div class="doc-toolbar">
      <button class="toolbar-btn"><i class="fa-solid fa-magnifying-glass-plus"></i> Zoom</button>
      <button class="toolbar-btn"><i class="fa-solid fa-arrows-up-down"></i> Scroll</button>
    </div>
    <div class="doc-embed-wrapper">
      <iframe src="https://sassy-flier-535.notion.site/ebd//b76d12e2102e4482a9c4d08580582827" width="100%" height="100%" frameborder="0"></iframe>
    </div>
  </div>

  <div class="footer-container">
    <a href="dashboard.html" class="dashboard-link-btn">
      <i class="fa-solid fa-arrow-left" style="margin-right: 10px;"></i> RETURN TO DASHBOARD
    </a>
  </div>

  <div class="floating-scroll-indicator">
    <i class="fa-solid fa-arrow-down"></i>
  </div>

</body>
</html>

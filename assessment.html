<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Assessment of Behavior | Caryll's Growth Portfolio</title>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"/>
  
  <style>
    /* GLOBAL STRUCTURE */
    html {
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      height: 100% !important;
    }
    
    body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      min-height: 100vh !important; 
      background-color: #ffffff !important;
      font-family: 'Quicksand', sans-serif !important;
      color: #2d3436 !important;
      display: block !important;
      box-sizing: border-box !important;
    }

    .page-container {
      width: 100% !important;
      max-width: 900px !important;
      margin: 0 auto !important; 
      padding: 60px 20px 40px !important; 
      box-sizing: border-box !important;
    }

    /* TYPOGRAPHY HEADERS */
    .header-section {
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      margin-bottom: 40px !important;
    }

    .page-icon {
      font-size: 38px !important; 
      color: #27ae60 !important; 
      margin-bottom: 20px !important;
    }

    h1 { 
      font-family: 'Montserrat', sans-serif !important; 
      font-size: 32px !important; 
      font-weight: 800 !important; 
      color: #2d3436 !important; 
      text-transform: uppercase !important; 
      letter-spacing: 4px !important; 
      margin: 0 !important;
      text-align: center !important;
      line-height: 1.2 !important;
    }

    .title-accent-line {
      width: 45px !important;
      height: 3px !important;
      background-color: #e67e22 !important;
      margin-top: 15px !important;
      border-radius: 2px !important;
    }

    /* EMBED CONTROLS & VIEWER INTERFACE */
    .viewer-card {
      background: #fafbfc !important;
      border: 1px solid #f0f3f4 !important;
      border-radius: 24px !important;
      padding: 30px !important;
      box-shadow: 0 4px 15px rgba(0,0,0,0.01) !important;
      margin-bottom: 40px !important;
    }

    .document-section {
      margin-bottom: 40px;
    }

    .document-section:last-child {
      margin-bottom: 0;
    }

    .doc-title {
      font-family: 'Montserrat', sans-serif !important;
      font-size: 14px !important;
      font-weight: 700 !important;
      text-transform: uppercase !important;
      letter-spacing: 1px !important;
      color: #2d3436 !important;
      margin: 0 0 15px 0 !important;
      display: flex !important;
      align-items: center !important;
      gap: 10px !important;
    }

    .doc-title i {
      color: #27ae60 !important;
    }

    /* CONTROLS BAR */
    .toolbar {
      display: flex !important;
      flex-wrap: wrap !important;
      align-items: center !important;
      justify-content: space-between !important;
      gap: 15px !important;
      background: #ffffff !important;
      border: 1px solid #eef2f3 !important;
      border-bottom: none !important;
      border-radius: 16px 16px 0 0 !important;
      padding: 12px 20px !important;
    }

    .tool-group {
      display: flex !important;
      align-items: center !important;
      gap: 12px !important;
    }

    .zoom-label {
      font-size: 12px !important;
      font-weight: 700 !important;
      color: #64748b !important;
      min-width: 45px !important;
    }

    /* SLIDER STYLING */
    .zoom-slider {
      -webkit-appearance: none !important;
      appearance: none !important;
      width: 130px !important;
      height: 6px !important;
      background: #e2e8f0 !important;
      border-radius: 3px !important;
      outline: none !important;
    }

    .zoom-slider::-webkit-slider-thumb {
      -webkit-appearance: none !important;
      appearance: none !important;
      width: 16px !important;
      height: 16px !important;
      border-radius: 50% !important;
      background: #e67e22 !important;
      cursor: pointer !important;
      transition: transform 0.1s ease !important;
    }

    .zoom-slider::-webkit-slider-thumb:hover {
      transform: scale(1.2) !important;
    }

    /* TOOLBAR BUTTONS */
    .tool-btn {
      background: #ffffff !important;
      border: 1px solid #cbd5e1 !important;
      color: #475569 !important;
      padding: 6px 14px !important;
      border-radius: 6px !important;
      font-family: 'Montserrat', sans-serif !important;
      font-size: 11px !important;
      font-weight: 700 !important;
      text-transform: uppercase !important;
      letter-spacing: 1px !important;
      cursor: pointer !important;
      display: inline-flex !important;
      align-items: center !important;
      gap: 6px !important;
      transition: all 0.2s ease !important;
    }

    .tool-btn:hover {
      border-color: #27ae60 !important;
      color: #27ae60 !important;
      background: #f0fdf4 !important;
    }

    /* EMBED CONTAINER WITH ZOOM MECHANICAL TRANSFORM */
    .embed-window-frame {
      width: 100% !important;
      height: 550px !important;
      background: #ffffff !important;
      border: 1px solid #eef2f3 !important;
      border-radius: 0 0 16px 16px !important;
      overflow: auto !important; /* Enables independent inner scrolling */
      position: relative !important;
    }

    .zoom-wrapper {
      width: 100% !important;
      height: 100% !important;
      transform-origin: top left !important;
      transition: transform 0.1s ease-out !important;
    }

    iframe {
      width: 100% !important;
      height: 100% !important;
      border: none !important;
      display: block !important;
    }

    /* RETURN NAVIGATION BUTTON */
    .navigation-wrapper {
      display: flex !important;
      justify-content: center !important;
      margin-top: 50px !important;
    }

    .back-dashboard-btn {
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      gap: 12px !important;
      background-color: transparent !important;
      color: #e67e22 !important; 
      font-family: 'Montserrat', sans-serif !important;
      font-size: 11px !important;
      font-weight: 700 !important;
      text-transform: uppercase !important;
      letter-spacing: 2px !important;
      padding: 14px 40px !important;
      border: 2px solid #e67e22 !important; 
      border-radius: 8px !important; 
      text-decoration: none !important;
      transition: background-color 0.2s ease, color 0.2s ease, transform 0.2s ease !important;
    }

    .back-dashboard-btn:hover {
      transform: translateY(-2px) !important;
      background-color: #e67e22 !important;
      color: #ffffff !important;
    }

    footer {
      width: 100% !important;
      text-align: center !important;
      padding: 60px 0 30px !important;
      font-size: 11px !important;
      color: #95a5a6 !important;
      letter-spacing: 2px !important;
    }

    /* PRINT LAYOUT CONFIG */
    @media print {
      body { background: #ffffff !important; color: #000000 !important; }
      .viewer-card { border: none !important; box-shadow: none !important; padding: 0 !important; }
      .toolbar, .navigation-wrapper, .page-icon, .title-accent-line, footer { display: none !important; }
      .embed-window-frame { height: auto !important; overflow: visible !important; border: none !important; }
      .zoom-wrapper { transform: scale(1) !important; width: 100% !important; height: auto !important; }
      iframe { height: 800px !important; }
    }
  </style>
</head>
<body>

  <div class="page-container">
    
    <!-- HEADER SECTION -->
    <div class="header-section">
      <div class="page-icon">
        <i class="fa-solid fa-seedling"></i>
      </div>
      <h1>Assessment of Behavior</h1>
      <div class="title-accent-line"></div>
    </div>

    <!-- VIEWER CONTAINMENT SYSTEM -->
    <div class="viewer-card">
      
      <!-- DOCUMENT 1: GOOGLE DRIVE FILE -->
      <div class="document-section">
        <h3 class="doc-title"><i class="fa-solid fa-file-pdf"></i> Behavioral Evaluation Document</h3>
        
        <div class="toolbar">
          <div class="tool-group">
            <input type="range" class="zoom-slider" id="sliderDoc1" min="50" max="150" value="100" oninput="applyZoomEngine('wrapperDoc1', 'valueDoc1', this.value)">
            <span class="zoom-label" id="valueDoc1">100%</span>
          </div>
          <div class="tool-group">
            <button class="tool-btn" onclick="scrollBottomEngine('frameDoc1')"><i class="fa-solid fa-arrow-down"></i> Scroll Top/Bottom</button>
            <button class="tool-btn" onclick="printTargetEngine('https://drive.google.com/file/d/1P4nvaIigwRIfSGBfdWJ0mXDfFJapX3ai/preview')"><i class="fa-solid fa-print"></i> Print</button>
          </div>
        </div>

        <div class="embed-window-frame" id="frameDoc1">
          <div class="zoom-wrapper" id="wrapperDoc1">
            <!-- Swapped to /preview endpoint for secure embedded display -->
            <iframe src="https://drive.google.com/file/d/1P4nvaIigwRIfSGBfdWJ0mXDfFJapX3ai/preview" allow="autoplay"></iframe>
          </div>
        </div>
      </div>

      <!-- DOCUMENT 2: GOOGLE DOCS CASE STUDY -->
      <div class="document-section">
        <h3 class="doc-title"><i class="fa-solid fa-file-lines"></i> Behavior Intervention Guidelines</h3>
        
        <div class="toolbar">
          <div class="tool-group">
            <input type="range" class="zoom-slider" id="sliderDoc2" min="50" max="150" value="100" oninput="applyZoomEngine('wrapperDoc2', 'valueDoc2', this.value)">
            <span class="zoom-label" id="valueDoc2">100%</span>
          </div>
          <div class="tool-group">
            <button class="tool-btn" onclick="scrollBottomEngine('frameDoc2')"><i class="fa-solid fa-arrow-down"></i> Scroll Top/Bottom</button>
            <button class="tool-btn" onclick="printTargetEngine('https://docs.google.com/document/d/1kcr0ZX4z4Y55FsclBC30A92C4JkedEPQOATUeS5ZqJU/preview')"><i class="fa-solid fa-print"></i> Print</button>
          </div>
        </div>

        <div class="embed-window-frame" id="frameDoc2">
          <div class="zoom-wrapper" id="wrapperDoc2">
            <!-- Swapped to /preview endpoint for clean presentation inside frames -->
            <iframe src="https://docs.google.com/document/d/1kcr0ZX4z4Y55FsclBC30A92C4JkedEPQOATUeS5ZqJU/preview"></iframe>
          </div>
        </div>
      </div>

    </div>

    <!-- RETURN NAVIGATION BUTTON -->
    <div class="navigation-wrapper">
      <a href="https://tenasascaryllkayn-tech.github.io/growthportfolio-/dashboard.html" class="back-dashboard-btn">
        <i class="fa-solid fa-arrow-left"></i> Return to Dashboard
      </a>
    </div>

  </div>

  <footer>© 2026 Caryll's Growth Portfolio</footer>

  <script>
    /**
     * Zoom Engine Controller
     * Directly adjusts CSS transform scale property and dynamically matches width calculations 
     * to prevent frame clipping at high slider sizes.
     */
    function applyZoomEngine(wrapperId, labelId, scaleValue) {
      const targetWrapper = document.getElementById(wrapperId);
      const targetLabel = document.getElementById(labelId);
      
      const decimalFactor = scaleValue / 100;
      targetLabel.innerText = scaleValue + "%";
      
      // Scale framework transformation matrix
      targetWrapper.style.transform = `scale(${decimalFactor})`;
      
      // Calculate layout compensation to prevent container clipping during manual sizing zoom
      if (decimalFactor > 1) {
        targetWrapper.style.width = (100 / decimalFactor) + "%";
        targetWrapper.style.height = (100 / decimalFactor) + "%";
      } else {
        targetWrapper.style.width = "100%";
        targetWrapper.style.height = "100%";
      }
    }

    /**
     * Alternating Top/Bottom Scrolling Engine
     * Detects position inside the frame element container and toggles seamless scrolls.
     */
    function scrollBottomEngine(frameId) {
      const frameContainer = document.getElementById(frameId);
      const currentScroll = frameContainer.scrollTop;
      const maxScrollAvailable = frameContainer.scrollHeight - frameContainer.clientHeight;
      
      if (currentScroll >= (maxScrollAvailable - 10)) {
        frameContainer.scrollTo({ top: 0, behavior: 'smooth' });
      } else {
        frameContainer.scrollTo({ top: frameContainer.scrollHeight, behavior: 'smooth' });
      }
    }

    /**
     * Isolation Target Print Routine
     * Spawns an off-screen print thread window containing the document to bypass browser frame blockers.
     */
    function printTargetEngine(sourceUrl) {
      const executionWindow = window.open(sourceUrl, '_blank');
      executionWindow.focus();
      executionWindow.print();
    }
  </script>

</body>
</html>

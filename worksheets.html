<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Management Worksheets | Portfolio Asset</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"/>

  <style>
    body {
      background-color: #ffffff;
      color: #2d3436;
      font-family: 'Quicksand', sans-serif;
      padding: 40px 20px 120px 20px;
      max-width: 900px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .main-page-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 28px;
      font-weight: 800;
      color: #2d3436;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 20px;
      text-align: center;
      position: relative;
    }

    .main-page-title::after {
      content: '';
      display: block;
      width: 60px;
      height: 3px;
      background-color: #e67e22;
      margin: 8px auto 0 auto;
      border-radius: 2px;
    }

    .doc-container {
      position: relative;
      width: 100%;
      height: 650px;
      background: #fafafa;
      border: 1px solid rgba(0,0,0,0.06);
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
      overflow: hidden;
      margin-bottom: 20px;
    }

    .doc-container iframe {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 12px;
    }

    .utility-buttons {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .utility-buttons a, .utility-buttons button {
      font-family: 'Montserrat', sans-serif;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      color: #e67e22;
      padding: 10px 18px;
      border-radius: 6px;
      background: #ffffff;
      border: 2px solid #e67e22;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .utility-buttons a:hover, .utility-buttons button:hover {
      background-color: #e67e22;
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(230,126,34,0.2);
    }

    .note {
      font-size: 13px;
      color: #636e72;
      text-align: center;
      max-width: 90%;
      margin-top: 10px;
      line-height: 1.6;
    }

    .note strong {
      color: #e67e22;
    }

    .return-link-btn {
      margin-top: 30px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #e67e22;
      font-family: 'Montserrat', sans-serif;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      padding: 12px 28px;
      border-radius: 6px;
      background: #ffffff;
      border: 2px solid #e67e22;
      transition: all 0.3s ease;
    }

    .return-link-btn:hover {
      background-color: #e67e22;
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(230,126,34,0.2);
    }
  </style>
</head>
<body>

  <h1 class="main-page-title">Management Worksheets</h1>

  <!-- Google Doc / PDF Embed -->
  <div class="doc-container">
    <!-- Replace YOUR_DOC_ID with your actual Google Doc or PDF ID -->
    <iframe src="https://docs.google.com/document/d/YOUR_DOC_ID/preview" allowfullscreen></iframe>
  </div>

  <!-- Utility Buttons -->
  <div class="utility-buttons">
    <button onclick="window.open('https://docs.google.com/document/d/YOUR_DOC_ID/preview','_blank').print()">
      <i class="fa-solid fa-print"></i> Print
    </button>
    <a href="https://docs.google.com/document/d/YOUR_DOC_ID/export?format=pdf" target="_blank">
      <i class="fa-solid fa-download"></i> Download PDF
    </a>
    <a href="https://docs.google.com/document/d/YOUR_DOC_ID/edit?usp=sharing" target="_blank">
      <i class="fa-solid fa-up-right-from-square"></i> Open in Google Docs
    </a>
  </div>

  <!-- Instructional Use Note -->
  <p class="note">
    <strong>Note:</strong> These worksheets are provided for <strong>instructional purposes only</strong> and must <strong>not be sold</strong>.
  </p>

  <!-- Return to Dashboard -->
  <a href="dashboard.html" class="return-link-btn">
    <i class="fa-solid fa-arrow-left-long"></i> Return to Dashboard
  </a>

</body>
</html>

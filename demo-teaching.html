<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Growth Portfolio | Demo Teaching</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    /* Global Reset & Typography */
    body { background-color: #ffffff; font-family: 'Quicksand', sans-serif; color: #2d3436; margin: 0; padding: 40px 20px 120px; max-width: 850px; margin: 0 auto; }
    
    /* Header Section */
    .header-section { display: flex; flex-direction: column; align-items: center; margin-bottom: 50px; }
    h1 { font-family: 'Montserrat', sans-serif; font-size: 32px; font-weight: 800; text-transform: uppercase; letter-spacing: 4px; margin: 20px 0 0; text-align: center; }
    .title-accent-line { width: 45px; height: 3px; background-color: #e67e22; margin-top: 15px; border-radius: 2px; }

    /* Content Blocks */
    .content-panel { background: #fafbfc; border: 1px solid #f0f3f4; border-radius: 24px; padding: 40px; margin-bottom: 40px; }
    .section-label { font-family: 'Montserrat', sans-serif; font-size: 11px; font-weight: 800; color: #e67e22; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; }
    
    /* Media/Utility Styles */
    .video-wrapper { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 16px; overflow: hidden; margin-bottom: 20px; }
    .notebook-area { background: #ffffff; border: 1px solid #eef2f3; border-radius: 18px; padding: 25px; min-height: 150px; margin-bottom: 30px; }
    
    /* Anti-Pixelation Doc Viewer */
    .doc-container { position: relative; height: 600px; overflow: hidden; width: 100%; background: #fafafa; border: 1px solid rgba(0,0,0,0.06); border-radius: 16px; }
    .iframe-zoom-wrapper { width: 100%; height: 100%; overflow: auto; position: relative; border-radius: 16px; }
    .doc-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; transform-origin: top left; }

    /* Buttons */
    .utility-bar { display: flex; justify-content: center; gap: 15px; margin-top: 20px; flex-wrap: wrap; }
    .btn { display: inline-flex; align-items: center; gap: 10px; background: #ffffff; color: #e67e22; padding: 12px 25px; border: 2px solid #e67e22; border-radius: 8px; text-decoration: none; font-family: 'Montserrat', sans-serif; font-size: 11px; font-weight: 700; text-transform: uppercase; cursor: pointer; }
    .btn:hover { background: #e67e22; color: #fff; }
  </style>
</head>
<body>

  <div class="header-section">
    <i class="fa-solid fa-seedling" style="font-size: 38px; color: #27ae60;"></i>
    <h1>Demo Teaching</h1>
    <div class="title-accent-line"></div>
  </div>

  <!-- Video & Journal -->
  <div class="content-panel">
    <p class="section-label">Video Evidence</p>
    <div class="video-wrapper">
      <iframe src="https://www.youtube.com/embed/Jqr0cwi7qkk" frameborder="0" allowfullscreen></iframe>
    </div>
    
    <p class="section-label" style="margin-top: 20px;">Reflection Journal</p>
    <div class="notebook-area" id="reflectionJournal" contenteditable="false"><em>Loading reflection...</em></div>
  </div>

  <!-- Doc Viewer -->
  <div class="content-panel">
    <p class="section-label">Lesson Plan</p>
    <div class="doc-container" id="outerContainer">
      <div class="iframe-zoom-wrapper" id="zoomWrapper">
        <iframe id="docFrame" src="https://docs.google.com/document/d/1mdb8r3qnsqcDWXe4kq3zK5RfUKgJQcsiDu6i5Os4P-I/preview"></iframe>
      </div>
    </div>
    
    <div class="utility-bar">
      <input type="range" id="zoomRange" min="100" max="180" step="10" value="100">
      <a href="https://docs.google.com/document/d/1mdb8r3qnsqcDWXe4kq3zK5RfUKgJQcsiDu6i5Os4P-I/edit" target="_blank" class="btn">Open Doc</a>
    </div>
  </div>

  <script>
    // Supabase Load
    const supabase = supabase.createClient('https://gbtatmfnaaqqnmrjanvf.supabase.co', 'Sb_publishable_WB5kPvrpZaQ3Pqi6Dytvyw_05644sAz');
    const journal = document.getElementById('reflectionJournal');
    
    window.addEventListener('DOMContentLoaded', async () => {
        const { data } = await supabase.from('reflections').select('content').eq('id', 1).single();
        if (data) journal.innerHTML = data.content;
    });

    // Zoom Logic
    const slider = document.getElementById('zoomRange');
    const frame = document.getElementById('docFrame');
    const outer = document.getElementById('outerContainer');
    
    slider.addEventListener('input', function() {
      const scale = this.value / 100;
      frame.style.width = (100 * scale) + '%';
      frame.style.height = (100 * scale) + '%';
      frame.style.transform = `scale(${1 / scale})`;
      outer.style.height = (600 * scale) + 'px';
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Caryll's Growth Portfolio</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Exact Aesthetic Match to your Portfolio Branding */
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background-color: #ffffff; margin: 0; padding: 0; color: #333; text-align: center; }
        
        .brand-area { padding: 40px 20px; }
        .leaf-logo { font-size: 40px; margin-bottom: 5px; display: block; }
        h1 { font-weight: 800; letter-spacing: 1px; text-transform: uppercase; margin: 5px 0; }
        .sub-header { font-weight: 300; letter-spacing: 2px; color: #cc5500; margin-bottom: 30px; }

        .container { max-width: 800px; margin: auto; padding: 20px; text-align: left; }
        h3 { color: #cc5500; margin-top: 40px; border-bottom: 1px solid #eee; padding-bottom: 10px; }

        .notebook-editor { border: 1px solid #eee; padding: 30px; min-height: 200px; border-radius: 10px; margin: 20px 0; }
        .video-container { border: 2px solid #333; margin: 20px 0; }
        .auto-timestamp { color: #cc5500; text-decoration: underline; cursor: pointer; font-weight: bold; }
        
        .doc-wrapper { border: 1px solid #ddd; height: 600px; overflow: auto; margin-top: 20px; position: relative; }
        #zoomTarget { transform-origin: top left; transition: transform 0.2s; width: 100%; }
        .controls { margin-top: 20px; padding: 15px; background: #fafafa; border-radius: 5px; }
    </style>
</head>
<body>

<div class="brand-area">
    <span class="leaf-logo">🌱</span>
    <h1>Caryll's</h1>
    <div class="sub-header">GROWTH PORTFOLIO</div>
</div>

<div class="container">
    <h3>Demo Lesson Video</h3>
    <div class="video-container">
        <iframe id="lessonVideo" width="100%" height="450" src="https://www.youtube.com/embed/Jqr0cwi7qkk?enablejsapi=1" frameborder="0" allowfullscreen></iframe>
    </div>

    <div class="notebook-editor" id="reflectionJournal" contenteditable="false">
        <p id="statusMsg" style="color:#cc5500;"><em>View-Only Mode</em></p>
        <p>Type your reflections here...</p>
    </div>

    <h3>Lesson Plan</h3>
    <div class="controls">
        <label>Zoom:</label>
        <input type="range" id="zoomRange" min="50" max="150" value="100">
        <span id="zoomVal">100%</span>
    </div>

    <div class="doc-wrapper">
        <div id="zoomTarget">
            <iframe src="https://docs.google.com/document/d/1mdb8r3qnsqcDWXe4kq3zK5RfUKgJQcsiDu6i5Os4P-I/preview" width="100%" height="800px"></iframe>
        </div>
    </div>
</div>

<script>
    const supabase = supabase.createClient(
        'https://gbtatmfnaaqqnmrjanvf.supabase.co',
        'Sb_publishable_WB5kPvrpZaQ3Pqi6Dytvyw_05644sAz'
    );

    const journalArea = document.getElementById('reflectionJournal');
    const zoomTarget = document.getElementById('zoomTarget');
    const zoomRange = document.getElementById('zoomRange');

    zoomRange.addEventListener('input', (e) => {
        const val = e.target.value;
        zoomTarget.style.transform = `scale(${val / 100})`;
        document.getElementById('zoomVal').innerText = val + "%";
    });

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('edit') === 'true') {
        journalArea.setAttribute('contenteditable', 'true');
        document.getElementById('statusMsg').innerText = "Editing Enabled";
    }

    window.seekTo = function(seconds) {
        document.getElementById('lessonVideo').contentWindow.postMessage(JSON.stringify({
            event: 'command', func: 'seekTo', args: [seconds, true]
        }), '*');
    };

    function convertTimestamps() {
        const regex = /(\d{1,2}):(\d{2})/g;
        journalArea.innerHTML = journalArea.innerHTML.replace(regex, (match, m, s) => {
            const seconds = parseInt(m) * 60 + parseInt(s);
            return `<span class="auto-timestamp" onclick="seekTo(${seconds})">${match}</span>`;
        });
    }

    window.addEventListener('DOMContentLoaded', async () => {
        const { data } = await supabase.from('reflections').select('content').eq('id', 1).single();
        if (data) {
            journalArea.innerHTML = data.content;
            convertTimestamps();
        }
    });

    journalArea.addEventListener('keyup', () => {
        if (journalArea.getAttribute('contenteditable') === 'true') {
            clearTimeout(window.saveTimer);
            window.saveTimer = setTimeout(async () => {
                await supabase.from('reflections').upsert({ id: 1, content: journalArea.innerHTML });
            }, 2000);
        }
    });
</script>
</body>
</html>

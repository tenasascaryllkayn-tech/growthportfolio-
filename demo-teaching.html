<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Growth Portfolio</title>
    <!-- Load Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
        .notebook-editor { 
            border: 1px solid #ccc; 
            padding: 15px; 
            min-height: 300px; 
            border-radius: 8px; 
        }
        img { max-width: 100%; height: auto; display: block; margin: 10px 0; }
    </style>
</head>
<body>

    <h1>My Teaching Portfolio</h1>
    <p>Type your reflections or paste images below. Everything saves automatically!</p>
    
    <div id="reflectionJournal" class="notebook-editor" contenteditable="true"></div>

    <script>
        // 1. Initialize Cloud Connection
        const supabaseUrl = 'https://gbtatmfnaaqqnmrjanvf.supabase.co';
        const supabaseKey = 'Sb_publishable_WB5kPvrpZaQ3Pqi6Dytvyw_05644sAz'; 
        const supabase = supabase.createClient(supabaseUrl, supabaseKey);

        const journalArea = document.getElementById('reflectionJournal');

        // 2. Load data from Cloud on startup
        window.addEventListener('DOMContentLoaded', async () => {
            const { data } = await supabase
                .from('reflections')
                .select('content')
                .eq('id', 1)
                .single();
            if (data) journalArea.innerHTML = data.content;
        });

        // 3. Save to Cloud automatically
        async function saveToCloud() {
            const content = journalArea.innerHTML;
            await supabase
                .from('reflections')
                .upsert({ id: 1, content: content });
        }

        // Trigger save 1 second after you stop typing
        journalArea.addEventListener('keyup', () => {
            clearTimeout(window.saveTimer);
            window.saveTimer = setTimeout(saveToCloud, 1000);
        });

        // 4. Handle Image Pasting
        journalArea.addEventListener('paste', (e) => {
            const items = e.clipboardData.items;
            for (let item of items) {
                if (item.type.startsWith('image')) {
                    const file = item.getAsFile();
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        const img = document.createElement('img');
                        img.src = event.target.result;
                        journalArea.appendChild(img);
                        saveToCloud(); // Save immediately after adding image
                    };
                    reader.readAsDataURL(file);
                }
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Growth Portfolio | Demo Teaching</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"/>
  <style>
    body {
      margin: 0;
      font-family: 'Quicksand', sans-serif;
      background-color: #f8f9fa;
      color: #2d3436;
    }
    .header-section {
      text-align: center;
      padding: 20px;
      background: #fff;
      border-bottom: 2px solid #e67e22;
    }
    .seedling-icon { font-size: 48px; }
    h1 {
      font-family: 'Montserrat', sans-serif;
      font-size: 36px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 5px;
      margin: 10px 0;
      color: #2d3436;
    }
    .section-label {
      font-family: 'Montserrat', sans-serif;
      font-size: 14px;
      font-weight: 800;
      color: #e67e22;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin: 20px 0 10px;
      text-align: center;
    }
    .iframe-full {
      width: 100%;
      height: 100vh; /* full viewport height */
      border: none;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #ffffff;
      color: #e67e22;
      padding: 12px 25px;
      border: 2px solid #e67e22;
      border-radius: 10px;
      text-decoration: none;
      font-family: 'Montserrat', sans-serif;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      cursor: pointer;
      transition: 0.3s;
      margin: 20px auto;
    }
    .btn:hover { background: #e67e22; color: #ffffff; }
    .footer { text-align: center; padding: 20px; }
  </style>
</head>
<body>
  <div class="header-section">
    <div class="seedling-icon">🌱</div>
    <h1>Demo Teaching</h1>
  </div>

  <div class="section-label">Video Evidence</div>
  <iframe class="iframe-full" src="https://www.youtube.com/embed/Jqr0cwi7qkk" allowfullscreen></iframe>

  <div class="section-label">Sky Garden Document</div>
  <iframe class="iframe-full" src="https://docs.google.com/document/d/e/2PACX-1vS8YYlEkeaYy4sHXhfo7oJPCW0sadLAmeC_w2ymESsYvol2DsEThirn-v-Un3RN97hIrdxsCiC9vpdB/pub?embedded=true"></iframe>

  <div class="section-label">Reflection</div>
  <iframe class="iframe-full" src="https://docs.google.com/document/d/e/2PACX-1vRMfGiF5Eb63i3KqxKnRpUbINqHPqKBfiqgP8mwNWnZ-vZy37CCfRUt002ITgF1PP4H09xcFmr7P-To/pub?embedded=true"></iframe>

  <div class="footer">
    <a href="dashboard.html" class="btn"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</a>
  </div>
</body>
</html>

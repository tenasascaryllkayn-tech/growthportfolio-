<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Caryll's Growth Portfolio</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Modern, Clean Base */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #ffffff; 
            margin: 0; 
            color: #2d3436;
            line-height: 1.6;
        }

        /* Minimalist Nav - No clunky blocks */
        nav { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 20px 5%; 
            border-bottom: 1px solid #f0f0f0; 
        }
        .nav-brand { font-weight: 700; letter-spacing: -0.5px; }
        .nav-link { text-decoration: none; color: #636e72; font-size: 0.9rem; transition: color 0.2s; }
        .nav-link:hover { color: #000; }

        .main-container { max-width: 800px; margin: 40px auto; padding: 0 20px; }
        h1 { font-size: 2rem; margin-bottom: 1rem; }
        h2 { font-size: 1.2rem; color: #636e72; margin-bottom: 2rem; font-weight: 400; }

        /* Video and Doc container - Clean edges */
        .video-wrapper { aspect-ratio: 16 / 9; background: #f9f9f9; border-radius: 8px; overflow: hidden; margin-bottom: 3rem; }
        .notebook-area { background: #fafafa; padding: 2rem; border-radius: 8px; margin-bottom: 3rem; }
        
        .zoom-controls { margin-bottom: 10px; display: flex; gap: 10px; align-items: center; font-size: 0.8rem; }
        .doc-viewer { border: 1px solid #eee; height: 600px; overflow: auto; border-radius: 4px; background: #fff; }
        #zoomTarget { transform-origin: top left; transition: transform 0.15s ease-out; }
    </style>
</head>
<body>

<nav>
    <div class="nav-brand">CARYLL KAYN</div>
    <a href="index.html" class="nav-link">← Return to Dashboard</a>
</nav>

<div class="main-container">
    <h1>Growth Portfolio</h1>
    <h2>Demo Lesson Video</h2>
    
    <div class="video-wrapper">
        <iframe id="lessonVideo" width="100%" height="100%" src="https://www.youtube.com/embed/Jqr0cwi7qkk?enablejsapi=1" frameborder="0" allowfullscreen></iframe>
    </div>

    <div class="notebook-area" id="reflectionJournal" contenteditable="false">
        <p id="statusMsg"><em>View-Only Mode</em></p>
    </div>

    <h3>Lesson Plan</h3>
    <div class="zoom-controls">
        <label>Zoom</label>
        <input type="range" id="zoomRange" min="50" max="150" value="100">
        <span id="zoomVal">100%</span>
    </div>

    <div class="doc-viewer">
        <div id="zoomTarget">
            <iframe src="https://docs.google.com/document/d/1mdb8r3qnsqcDWXe4kq3zK5RfUKgJQcsiDu6i5Os4P-I/preview" width="100%" height="800px"></iframe>
        </div>
    </div>
</div>

<script>
    const supabase = supabase.createClient(
        'https://gbtatmfnaaqqnmrjanvf.supabase.co',
        'Sb_publishable_WB5kPvrpZaQ3Pqi6Dytvyw_05644sAz'
    );

    const journalArea = document.getElementById('reflectionJournal');
    const zoomTarget = document.getElementById('zoomTarget');
    const zoomRange = document.getElementById('zoomRange');

    zoomRange.addEventListener('input', (e) => {
        const val = e.target.value;
        zoomTarget.style.transform = `scale(${val / 100})`;
        document.getElementById('zoomVal').innerText = val + "%";
    });

    // Check for edit mode
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('edit') === 'true') {
        journalArea.setAttribute('contenteditable', 'true');
        document.getElementById('statusMsg').innerText = "Editing Enabled";
    }

    // Load content
    window.addEventListener('DOMContentLoaded', async () => {
        const { data } = await supabase.from('reflections').select('content').eq('id', 1).single();
        if (data) journalArea.innerHTML = data.content;
    });

    // Autosave
    journalArea.addEventListener('keyup', () => {
        if (journalArea.getAttribute('contenteditable') === 'true') {
            clearTimeout(window.saveTimer);
            window.saveTimer = setTimeout(async () => {
                await supabase.from('reflections').upsert({ id: 1, content: journalArea.innerHTML });
            }, 2000);
        }
    });
</script>
</body>
</html>

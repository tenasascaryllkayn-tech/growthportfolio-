<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Growth Portfolio | Demo Teaching</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"/>
  <style>
    body {
      background-color: #f8f9fa;
      font-family: 'Quicksand', sans-serif;
      color: #2d3436;
      margin: 0;
      padding: 40px 20px 120px;
      max-width: 1000px;
      margin: 0 auto;
    }
    .header-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 50px;
    }
    .seedling-icon { font-size: 48px; margin-bottom: 10px; }
    h1 {
      font-family: 'Montserrat', sans-serif;
      font-size: 36px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 5px;
      margin: 0;
      color: #2d3436;
    }
    .title-accent-line {
      width: 60px;
      height: 4px;
      background-color: #e67e22;
      margin-top: 15px;
      border-radius: 2px;
    }
    
    .content-panel {
      background: #ffffff;
      border: 1px solid #eef2f3;
      border-radius: 24px;
      padding: 40px;
      margin-bottom: 30px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.02);
    }
    .section-label {
      font-family: 'Montserrat', sans-serif;
      font-size: 12px;
      font-weight: 800;
      color: #e67e22;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 15px;
      display: block;
    }
    
    .video-wrapper {
      width: 100%;
      height: 550px;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 30px;
    }
    .video-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    
    .doc-preview-wrapper {
      width: 100%;
      height: 700px;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid #dfe6e9;
      margin-bottom: 20px;
    }
    .doc-preview-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #ffffff;
      color: #e67e22;
      padding: 12px 25px;
      border: 2px solid #e67e22;
      border-radius: 10px;
      text-decoration: none;
      font-family: 'Montserrat', sans-serif;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      cursor: pointer;
      transition: 0.3s;
    }
    .btn:hover { background: #e67e22; color: #ffffff; }

    /* Responsive adjustments */
    @media (max-width: 768px) {
      .video-wrapper { height: 400px; }
      .doc-preview-wrapper { height: 500px; }
    }
    @media (max-width: 480px) {
      .video-wrapper { height: 300px; }
      .doc-preview-wrapper { height: 350px; }
    }
  </style>
</head>
<body>
  <div class="header-section">
    <div class="seedling-icon">🌱</div>
    <h1>Demo Teaching</h1>
    <div class="title-accent-line"></div>
  </div>

  <div class="content-panel">
    <span class="section-label">Video Evidence</span>
    <div class="video-wrapper">
      <iframe src="https://www.youtube.com/embed/Jqr0cwi7qkk" allowfullscreen></iframe>
    </div>

    <span class="section-label">Lesson Plan Preview</span>
    <div class="doc-preview-wrapper">
      <iframe src="https://docs.google.com/document/d/1mdb8r3qnsqcDWXe4kq3zK5RfUKgJQcsiDu6i5Os4P-I/preview"></iframe>
    </div>
    <a href="https://docs.google.com/document/d/1mdb8r3qnsqcDWXe4kq3zK5RfUKgJQcsiDu6i5Os4P-I/edit" target="_blank" class="btn">
      <i class="fa-solid fa-arrow-up-right-from-square"></i> Open Full Lesson Plan
    </a>

    <span class="section-label">Additional Document</span>
    <div class="doc-preview-wrapper">
      <iframe src="https://docs.google.com/document/d/e/2PACX-1vS8YYlEkeaYy4sHXhfo7oJPCW0sadLAmeC_w2ymESsYvol2DsEThirn-v-Un3RN97hIrdxsCiC9vpdB/pub?embedded=true"></iframe>
    </div>
  </div>

  <div style="text-align: center;">
    <a href="index.html" class="btn"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</a>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Caryll's Growth Portfolio</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f4f9; padding: 20px; }
        .container { max-width: 900px; margin: auto; }
        .notebook-editor { 
            background: white; border: 1px solid #ddd; padding: 20px; min-height: 400px; 
            border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin: 20px 0;
        }
        .video-container { margin: 20px 0; border: 3px solid #333; }
        .auto-timestamp { color: blue; text-decoration: underline; cursor: pointer; font-weight: bold; }
        
        /* Google Doc Styling */
        .doc-wrapper { margin-top: 20px; border: 2px solid #ccc; overflow: auto; height: 600px; background: white; }
        .doc-container { width: 100%; height: 100%; transition: transform 0.2s; transform-origin: top left; }
        .controls { margin: 10px 0; padding: 15px; background: #fff; border-radius: 8px; border: 1px solid #ddd; }
    </style>
</head>
<body>

<div class="container">
    <h1>Caryll's Growth Portfolio</h1>

    <!-- 1. Video on top -->
    <h3>Demo Lesson Video</h3>
    <div class="video-container">
        <iframe id="lessonVideo" width="100%" height="400" src="https://www.youtube.com/embed/Jqr0cwi7qkk?enablejsapi=1" frameborder="0" allowfullscreen></iframe>
    </div>

    <!-- 2. Notebook in the middle -->
    <div class="notebook-editor" id="reflectionJournal" contenteditable="false">
        <h3>Reflection Journal</h3>
        <p id="statusMsg"><em>View-Only Mode</em></p>
        <p>Type your reflections here... (e.g., At 1:30, I noticed...)</p>
    </div>

    <!-- 3. Lesson Plan at the bottom -->
    <h3>Lesson Plan</h3>
    <div class="controls">
        <label><strong>Zoom Lesson Plan:</strong></label>
        <input type="range" id="zoomRange" min="50" max="150" value="100">
        <span id="zoomVal">100%</span>
        <button onclick="window.print()">Print Lesson Plan</button>
    </div>

    <div class="doc-wrapper">
        <div id="docContainer" class="doc-container">
            <iframe src="https://docs.google.com/document/d/1mdb8r3qnsqcDWXe4kq3zK5RfUKgJQcsiDu6i5Os4P-I/preview" width="100%" height="100%"></iframe>
        </div>
    </div>
</div>

<script>
    const supabase = supabase.createClient(
        'https://gbtatmfnaaqqnmrjanvf.supabase.co',
        'Sb_publishable_WB5kPvrpZaQ3Pqi6Dytvyw_05644sAz'
    );

    const journalArea = document.getElementById('reflectionJournal');
    const docContainer = document.getElementById('docContainer');
    const zoomRange = document.getElementById('zoomRange');

    zoomRange.addEventListener('input', (e) => {
        const val = e.target.value;
        docContainer.style.transform = `scale(${val / 100})`;
        document.getElementById('zoomVal').innerText = val + "%";
    });

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('edit') === 'true') {
        journalArea.setAttribute('contenteditable', 'true');
        document.getElementById('statusMsg').innerText = "Editing Enabled";
    }

    window.seekTo = function(seconds) {
        document.getElementById('lessonVideo').contentWindow.postMessage(JSON.stringify({
            event: 'command', func: 'seekTo', args: [seconds, true]
        }), '*');
    };

    function convertTimestamps() {
        const regex = /(\d{1,2}):(\d{2})/g;
        journalArea.innerHTML = journalArea.innerHTML.replace(regex, (match, m, s) => {
            const seconds = parseInt(m) * 60 + parseInt(s);
            return `<span class="auto-timestamp" onclick="seekTo(${seconds})">${match}</span>`;
        });
    }

    window.addEventListener('DOMContentLoaded', async () => {
        const { data } = await supabase.from('reflections').select('content').eq('id', 1).single();
        if (data) {
            journalArea.innerHTML = data.content;
            convertTimestamps();
        }
    });

    async function saveToCloud() {
        if (journalArea.getAttribute('contenteditable') === 'true') {
            await supabase.from('reflections').upsert({ id: 1, content: journalArea.innerHTML });
        }
    }

    journalArea.addEventListener('keyup', () => {
        clearTimeout(window.saveTimer);
        window.saveTimer = setTimeout(saveToCloud, 2000);
    });
</script>
</body>
</html>

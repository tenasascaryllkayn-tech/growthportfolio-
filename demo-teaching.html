<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Growth Portfolio | Demo Teaching</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { background-color: #ffffff; font-family: 'Quicksand', sans-serif; color: #2d3436; margin: 0; padding: 40px 20px 120px; max-width: 850px; margin: 0 auto; }
    .header-section { display: flex; flex-direction: column; align-items: center; margin-bottom: 50px; }
    h1 { font-family: 'Montserrat', sans-serif; font-size: 32px; font-weight: 800; text-transform: uppercase; letter-spacing: 4px; margin: 20px 0 0; text-align: center; }
    .title-accent-line { width: 45px; height: 3px; background-color: #e67e22; margin-top: 15px; border-radius: 2px; }
    .content-panel { background: #fafbfc; border: 1px solid #f0f3f4; border-radius: 24px; padding: 40px; margin-bottom: 40px; }
    .section-label { font-family: 'Montserrat', sans-serif; font-size: 11px; font-weight: 800; color: #e67e22; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 20px; }
    .video-wrapper { width: 100%; min-height: 450px; background: #000; border-radius: 16px; overflow: hidden; margin-bottom: 30px; }
    .video-wrapper iframe { width: 100%; height: 500px; display: block; }
    .notebook-area { background: #ffffff; border: 2px dashed #e67e22; border-radius: 18px; padding: 25px; min-height: 150px; margin-bottom: 20px; }
    .ts-link { color: #e67e22; text-decoration: underline; cursor: pointer; font-weight: bold; }
    .doc-preview-wrapper { width: 100%; height: 600px; border-radius: 16px; overflow: hidden; border: 1px solid #eef2f3; margin-bottom: 20px; }
    .doc-preview-wrapper iframe { width: 100%; height: 100%; border: none; }
    .controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
    #timestamp { font-size: 12px; color: #7f8c8d; font-style: italic; }
    .btn { display: inline-flex; align-items: center; gap: 10px; background: #ffffff; color: #e67e22; padding: 12px 25px; border: 2px solid #e67e22; border-radius: 8px; text-decoration: none; font-family: 'Montserrat', sans-serif; font-size: 11px; font-weight: 700; text-transform: uppercase; cursor: pointer; }
    .btn:hover { background: #e67e22; color: #fff; }
  </style>
</head>
<body>
  <div class="header-section">
    <h1>Demo Teaching</h1>
    <div class="title-accent-line"></div>
  </div>
  <div class="content-panel">
    <p class="section-label">Video Evidence</p>
    <div class="video-wrapper">
      <iframe id="vidFrame" src="https://www.youtube.com/embed/Jqr0cwi7qkk?enablejsapi=1" frameborder="0" allowfullscreen></iframe>
    </div>
    <p class="section-label">Reflection Journal</p>
    <p style="font-size: 12px; color: #7f8c8d; margin-bottom: 10px;"><em>Tip: Click any orange timestamp (e.g., 4:00) to jump to that moment in the video.</em></p>
    <div class="notebook-area" id="reflectionJournal" contenteditable="true">Loading...</div>
    <div class="controls">
      <span id="timestamp">Last saved: Never</span>
      <button class="btn" onclick="saveReflection()">Save Reflection</button>
    </div>
    
    <p class="section-label">Lesson Plan Preview</p>
    <div class="doc-preview-wrapper">
      <iframe src="https://docs.google.com/document/d/1mdb8r3qnsqcDWXe4kq3zK5RfUKgJQcsiDu6i5Os4P-I/preview"></iframe>
    </div>
    <a href="https://docs.google.com/document/d/1mdb8r3qnsqcDWXe4kq3zK5RfUKgJQcsiDu6i5Os4P-I/edit" target="_blank" class="btn">Open Full Lesson Plan</a>
  </div>
  <div class="content-panel" style="text-align: center;">
    <a href="index.html" class="btn"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</a>
  </div>

  <script>
    const supabase = supabase.createClient('https://gbtatmfnaaqqnmrjanvf.supabase.co', 'Sb_publishable_WB5kPvrpZaQ3Pqi6Dytvyw_05644sAz');
    const journal = document.getElementById('reflectionJournal');
    const ts = document.getElementById('timestamp');
    const vidFrame = document.getElementById('vidFrame');

    journal.addEventListener('click', (e) => {
        if (e.target.classList.contains('ts-link')) {
            const time = e.target.dataset.time;
            vidFrame.src = "https://www.youtube.com/embed/Jqr0cwi7qkk?enablejsapi=1&start=" + time;
        }
    });

    async function load() {
        const { data } = await supabase.from('reflections').select('content').eq('id', 1).single();
        if (data) journal.innerHTML = data.content;
    }
    
    async function saveReflection() {
        let html = journal.innerHTML.replace(/(\d+):(\d+)/g, (match, m, s) => {
            const seconds = parseInt(m) * 60 + parseInt(s);
            return `<span class="ts-link" data-time="${seconds}">${match}</span>`;
        });
        await supabase.from('reflections').update({ content: html }).eq('id', 1);
        ts.innerText = "Last saved: " + new Date().toLocaleString();
    }
    load();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Caryll's Growth Portfolio</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --terracotta: #cc5500; --off-white: #fcf9f5; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--off-white); margin: 0; padding: 0; }
        
        /* Header Match */
        .header-bar { background: var(--terracotta); color: white; padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; }
        .dashboard-link { font-weight: bold; }
        .home-btn { background: rgba(255,255,255,0.2); padding: 8px 16px; border-radius: 4px; color: white; text-decoration: none; }

        .container { max-width: 800px; margin: 40px auto; padding: 20px; }
        h1, h3 { color: var(--terracotta); }

        .notebook-editor { background: white; border: 1px solid #e0e0e0; padding: 30px; min-height: 200px; border-radius: 8px; margin: 20px 0; }
        .video-container { border: 4px solid var(--terracotta); border-radius: 8px; overflow: hidden; }
        .auto-timestamp { color: var(--terracotta); text-decoration: underline; cursor: pointer; font-weight: bold; }
        
        /* Zoom/Scroll Logic */
        .doc-wrapper { border: 2px solid #ddd; height: 600px; overflow: scroll; background: white; position: relative; }
        #zoomTarget { transform-origin: top left; width: 100%; transition: transform 0.1s; }
    </style>
</head>
<body>

<div class="header-bar">
    <div class="dashboard-link">Terracotta Dashboard 🍃</div>
    <a href="index.html" class="home-btn">Back to Home</a>
</div>

<div class="container">
    <h1>Caryll's Growth Portfolio</h1>

    <h3>Demo Lesson Video</h3>
    <div class="video-container">
        <iframe id="lessonVideo" width="100%" height="400" src="https://www.youtube.com/embed/Jqr0cwi7qkk?enablejsapi=1" frameborder="0" allowfullscreen></iframe>
    </div>

    <div class="notebook-editor" id="reflectionJournal" contenteditable="false">
        <p id="statusMsg" style="color:var(--terracotta);"><em>View-Only Mode</em></p>
        <p>Type your reflections here...</p>
    </div>

    <h3>Lesson Plan</h3>
    <div class="controls" style="margin-bottom:10px;">
        <input type="range" id="zoomRange" min="50" max="150" value="100">
        <span id="zoomVal">100%</span>
    </div>

    <div class="doc-wrapper">
        <div id="zoomTarget">
            <iframe src="https://docs.google.com/document/d/1mdb8r3qnsqcDWXe4kq3zK5RfUKgJQcsiDu6i5Os4P-I/preview" width="100%" height="800px"></iframe>
        </div>
    </div>
</div>

<script>
    const supabase = supabase.createClient(
        'https://gbtatmfnaaqqnmrjanvf.supabase.co',
        'Sb_publishable_WB5kPvrpZaQ3Pqi6Dytvyw_05644sAz'
    );

    const journalArea = document.getElementById('reflectionJournal');
    const zoomTarget = document.getElementById('zoomTarget');
    const zoomRange = document.getElementById('zoomRange');

    // FIXED ZOOM LOGIC
    zoomRange.addEventListener('input', (e) => {
        const val = e.target.value;
        zoomTarget.style.transform = `scale(${val / 100})`;
        zoomTarget.style.width = `${100 / (val / 100)}%`; // Keeps layout correct
        document.getElementById('zoomVal').innerText = val + "%";
    });

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('edit') === 'true') {
        journalArea.setAttribute('contenteditable', 'true');
        document.getElementById('statusMsg').innerText = "Editing Enabled";
    }

    window.seekTo = function(seconds) {
        document.getElementById('lessonVideo').contentWindow.postMessage(JSON.stringify({
            event: 'command', func: 'seekTo', args: [seconds, true]
        }), '*');
    };

    function convertTimestamps() {
        const regex = /(\d{1,2}):(\d{2})/g;
        journalArea.innerHTML = journalArea.innerHTML.replace(regex, (match, m, s) => {
            const seconds = parseInt(m) * 60 + parseInt(s);
            return `<span class="auto-timestamp" onclick="seekTo(${seconds})">${match}</span>`;
        });
    }

    window.addEventListener('DOMContentLoaded', async () => {
        const { data } = await supabase.from('reflections').select('content').eq('id', 1).single();
        if (data) {
            journalArea.innerHTML = data.content;
            convertTimestamps();
        }
    });

    journalArea.addEventListener('keyup', () => {
        if (journalArea.getAttribute('contenteditable') === 'true') {
            clearTimeout(window.saveTimer);
            window.saveTimer = setTimeout(async () => {
                await supabase.from('reflections').upsert({ id: 1, content: journalArea.innerHTML });
            }, 2000);
        }
    });
</script>
</body>
</html>

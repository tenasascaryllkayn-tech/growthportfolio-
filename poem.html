<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>A Teacher's Symphony | Portfolio Asset</title>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
  
  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"/>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    body {
      background-color: #ffffff;
      color: #2d3436;
      font-family: 'Quicksand', sans-serif;
      padding: 40px 20px 120px 20px; 
      max-width: 500px; 
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .brand-icon {
      color: #2ecc71; 
      font-size: 32px;
      margin-bottom: 20px;
      animation: gentle-bounce 2s infinite ease-in-out;
    }

    .poem-container {
      position: relative; 
      height: 600px; 
      overflow: hidden; 
      width: 100%; 
      background: #fafafa;
      border: 1px solid rgba(0, 0, 0, 0.06);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04); 
      margin-bottom: 30px;
      transition: height 0.3s ease;
    }

    .poem-container iframe {
      position: absolute; 
      top: 0; left: 0; 
      width: 100%; height: 100%;
      border: 0;
      border-radius: 16px;
    }

    .meta-caption {
      text-align: center;
      max-width: 90%;
      margin: 0 auto 30px auto;
    }

    .meta-caption p {
      font-size: 13px;
      color: #636e72;
      line-height: 1.6;
      font-weight: 500;
    }

    .meta-caption span {
      display: block;
      margin-top: 8px;
      font-family: 'Montserrat', sans-serif;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #e67e22;
    }

    .section-heading {
      font-family: 'Montserrat', sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: #e67e22;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 15px;
      text-align: center;
    }

    .utility-buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .utility-buttons button, .utility-buttons a, .utility-buttons input[type=range] {
      font-family: 'Montserrat', sans-serif;
      font-size: 11px; 
      font-weight: 700; 
      text-transform: uppercase; 
      letter-spacing: 1px; 
      transition: all 0.3s ease;
    }

    .utility-buttons button, .utility-buttons a {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none; 
      color: #e67e22; 
      padding: 8px 16px;
      border-radius: 6px;
      background: #ffffff;
      border: 2px solid #e67e22; 
      cursor: pointer;
    }

    .utility-buttons button:hover, .utility-buttons a:hover {
      background-color: #e67e22;
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(230, 126, 34, 0.2);
    }

    .utility-buttons input[type=range] {
      width: 150px;
      accent-color: #e67e22;
    }

    .mobile-nav-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 500px;
      background-color: rgba(255, 255, 255, 0.95); 
      backdrop-filter: blur(8px);
      border-top: 1px solid rgba(0, 0, 0, 0.05);
      padding: 20px;
      display: flex;
      justify-content: center;
      z-index: 2000;
    }

    .return-link-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none; 
      color: #e67e22; 
      font-family: 'Montserrat', sans-serif;
      font-size: 11px; 
      font-weight: 700; 
      text-transform: uppercase; 
      letter-spacing: 2px; 
      transition: all 0.3s ease;
      padding: 12px 28px;
      border-radius: 6px;
      background: #ffffff;
      border: 2px solid #e67e22; 
      cursor: pointer;
    }

    .return-link-btn:hover {
      background-color: #e67e22;
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(230, 126, 34, 0.2);
    }

    @keyframes gentle-bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
  </style>
</head>
<body>

  <div class="brand-icon">
    <i class="fa-solid fa-seedling"></i>
  </div>

  <!-- Genially Embed -->
  <div class="poem-container">
    <iframe 
      src="https://view.genially.com/69ac7f6014c7191a9d5c6ddb/interactive-content-a-teachers-symphony" 
      allowfullscreen="true" scrolling="yes">
    </iframe>
  </div>

  <div class="meta-caption">
    <p><strong>Teacher’s Guide:</strong> Please zoom in on the interactive Genially slide above to explore the visuals and text clearly.</p>
    <span>Interactive Experience</span>
  </div>

  <!-- Poem Reflection Heading -->
  <h2 class="section-heading">Poem Reflection</h2>

  <!-- Google Docs Embedded Viewer -->
  <div class="poem-container" id="docViewer">
    <iframe 
      id="docFrame"
      src="https://docs.google.com/document/d/1kU7EYf0ZcZDReONDU3FNVn1nonyavfGeIIgxq61oXoM/preview" 
      width="100%" height="100%" style="border:0; border-radius:16px;">
    </iframe>
  </div>

  <div class="meta-caption">
    <p>The reflection document is embedded above for direct viewing within the portfolio.</p>
    <div class="utility-buttons">
      <label for="zoomRange"><i class="fa-solid fa-magnifying-glass"></i> Zoom</label>
      <input type="range" id="zoomRange" min="600" max="1000" step="50" value="600" 
             oninput="adjustZoom(this.value)">
      <button onclick="printDoc()"><i class="fa-solid fa-print"></i> Print</button>
      <a href="https://docs.google.com/document/d/1kU7EYf0ZcZDReONDU3FNVn1nonyavfGeIIgxq61oXoM/edit?usp=sharing" target="_blank">
        <i class="fa-solid fa-up-right-from-square"></i> Open in Tab
      </a>
    </div>
    <span>Reflection Document Viewer</span>
  </div>

  <nav class="mobile-nav-bar">
    <a href="dashboard.html" class="return-link-btn">
       <i class="fa-solid fa-arrow-left-long"></i>
       Return to Dashboard
    </a>
  </nav>

  <script>
    function adjustZoom(value) {
      const viewer = document.getElementById("docViewer");
      viewer.style.height = value + "px";
    }

    function printDoc() {
      const frame = document.getElementById("docFrame").contentWindow;
      frame.focus();
      frame.print();
    }
  </script>

</body>
</
